name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.21.0
          runtime: node@24.21.0
          cache: true
      - run: pnpm run check
      - run: pnpm run format:check
      - run: pnpm run build
