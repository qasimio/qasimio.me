name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 11.21.0
          node-version: 24.21.0
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Astro check
        run: pnpm run check
      - name: Formatting
        run: pnpm run format:check
      - name: Build
        run: pnpm run build
