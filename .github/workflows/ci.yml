name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24.21.0
          cache: true

      - name: Type and Astro checks
        run: pnpm run check

      - name: Formatting
        run: pnpm run format:check

      - name: Production build
        run: pnpm run build
